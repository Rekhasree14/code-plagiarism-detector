```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeCheck - Upload Error</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .error-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .error-card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 20px;
            padding: 45px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        .error-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #fff3cd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .error-card h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .error-message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .supported-box {
            background: #f7f8fa;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .supported-box h3 {
            margin-bottom: 14px;
            font-size: 16px;
        }

        .formats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 9px;
        }

        .format {
            background: white;
            border: 1px solid #ddd;
            padding: 7px 13px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-weight: 600;
            transition: 0.2s;
        }

        .back-button:hover {
            transform: translateY(-2px);
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .brand span {
            font-weight: 400;
        }

    </style>

</head>

<body>

<div class="error-page">

    <div class="error-card">

        <div class="brand">
            CodeCheck <span>• Code Plagiarism Detector</span>
        </div>

        <div class="error-icon">
            ⚠
        </div>

        <h1>Upload Error</h1>

        <div class="error-title">
            Invalid file type
        </div>

        <p class="error-message">
            {{ message }}
        </p>

        <div class="supported-box">

            <h3>Supported file formats</h3>

            <div class="formats">

                <span class="format">.py</span>
                <span class="format">.java</span>
                <span class="format">.c</span>
                <span class="format">.cpp</span>
                <span class="format">.js</span>
                <span class="format">.html</span>
                <span class="format">.css</span>

            </div>

        </div>

        <a href="/" class="back-button">
            ← Try Again
        </a>

    </div>

</div>

</body>

</html>
```
